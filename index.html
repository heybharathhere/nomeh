<!DOCTYPE html>
<html lang="en" data-motion="auto" data-contrast="normal" data-text="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoMeh!</title>
<meta name="description" content="A private, offline-first personal performance app. Your data stays on your device.">
<meta name="theme-color" content="#050507">
<meta name="color-scheme" content="dark">

<!-- iOS standalone hints. Note: iOS ignores the manifest's display mode, so these matter. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoMeh!">

<!-- All paths are relative so the app works from https://user.github.io/REPO/ -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>

<a class="skip" href="#main">Skip to main content</a>

<div class="shell">
  <header class="topbar">
    <span class="brand">NoMeh<em>!</em></span>
    <div class="topbar-meta">
      <span class="net" id="net" data-state="online" title="Network status">
        <span class="dot" aria-hidden="true"></span>
        <span id="net-label">Online</span>
      </span>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Router renders here. Replaced on every navigation. -->
    <div class="boot" id="view">
      <p class="eyebrow">Starting</p>
      <p style="color:var(--text-dim)">Opening your local database…</p>
    </div>
  </main>
</div>

<nav class="dock" id="dock" aria-label="Main">
  <div class="dock-inner">
    <a href="#/today" data-route="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 12h4l2.5 6L14 5l2.5 7H21"/></svg>
      <span>Today</span><span class="ink"></span>
    </a>
    <a href="#/timeline" data-route="timeline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M5 4v16"/><circle cx="5" cy="8" r="2"/><circle cx="5" cy="16" r="2"/><path d="M10 8h9M10 16h6"/></svg>
      <span>Timeline</span><span class="ink"></span>
    </a>
    <a href="#/log" data-route="log" class="log-action" aria-label="Log something">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Log</span><span class="ink"></span>
    </a>
    <a href="#/body" data-route="body">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="5" r="2.4"/><path d="M12 8v5m0 0-3.5 7M12 13l3.5 7M6.5 10.5 12 9l5.5 1.5"/></svg>
      <span>Body</span><span class="ink"></span>
    </a>
    <a href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
      <span>Settings</span><span class="ink"></span>
    </a>
  </div>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:24px;max-width:520px;margin:0 auto;color:#f2f4f7;font-family:system-ui">
    <h1>JavaScript is required</h1>
    <p>NoMeh! runs entirely in your browser — the calculations, the database, and the
    offline support are all client-side. There is no server to fall back to.</p>
  </div>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
