<!DOCTYPE html>
<html lang="en" data-motion="auto" data-contrast="normal" data-text="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoMeh!</title>
<meta name="description" content="A private, offline-first personal performance app. Your data stays on your device.">
<meta name="theme-color" content="#050507">
<meta name="color-scheme" content="dark">

<!-- iOS standalone hints. Note: iOS ignores the manifest's display mode, so these matter. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoMeh!">

<!-- All paths are relative so the app works from https://user.github.io/REPO/ -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>

<a class="skip" href="#main">Skip to main content</a>

<div class="shell">
  <header class="topbar">
    <span class="brand">NoMeh<em>!</em></span>
    <div class="topbar-meta">
      <!-- Network status still exists (see wireNetworkStatus in main.js) — it
           now lives as a small dot on the profile pill instead of its own
           "ONLINE" badge, since that badge's spot is the profile entry point. -->
      <a class="profile-pill" id="profile-pill" href="#/settings" aria-label="Profile and settings">
        <span class="profile-avatar" id="profile-avatar" aria-hidden="true">?</span>
        <span class="net-dot" id="net-dot" data-state="online" title="Network status" aria-hidden="true"></span>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Router renders here. Replaced on every navigation. -->
    <div class="boot" id="view">
      <p class="eyebrow">Starting</p>
      <p style="color:var(--text-dim)">Opening your local database…</p>
    </div>
  </main>
</div>

<!-- The dock is generated at boot by buildDock() in src/main.js from UI.nav in
     src/config/app.config.js, so disabling a feature genuinely removes its tab.
     Kept empty here rather than duplicated, so there is one source of truth. -->
<nav class="dock" id="dock" aria-label="Main"></nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:24px;max-width:520px;margin:0 auto;color:#f2f4f7;font-family:system-ui">
    <h1>JavaScript is required</h1>
    <p>NoMeh! runs entirely in your browser — the calculations, the database, and the
    offline support are all client-side. There is no server to fall back to.</p>
  </div>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
